[plugin]
id = "deepseekharness_bridge"
name = "DeepSeek Harness 桥接"
description = "把 DeepSeek Harness (dsh) 的 agent 能力桥接到 N.E.K.O.，让猫娘可以驱动 harness 执行代码、分析资料等长任务。"
short_description = "Drive DeepSeek Harness agents from N.E.K.O."
keywords = ["deepseek", "dsh", "harness", "agent", "代码", "编程", "长任务", "桥接", "bridge"]
version = "0.1.0"
type = "plugin"
entry = "plugin.plugins.deepseekharness_bridge:DeepseekharnessBridgePlugin"

[plugin.author]
name = "N.E.K.O. Community"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = false
timeout = 300
startup_failure = "warn"

# Plugin-owned business settings. Typed on the Python side by DshSettings;
# these are the runtime-config defaults the host merges over.
[deepseekharness_bridge]
# Absolute path of the DeepSeek Harness checkout used to launch `pnpm dsh`.
# Leave empty to resolve `dsh` from PATH.
repo_path = ""
# Explicit `dsh` executable. Empty means "look on PATH".
dsh_executable = ""
# Extra working directory the harness should treat as its workspace root.
# Empty means the plugin falls back to its own storage directory.
workspace = ""
# Profile passed to `dsh`. `sdk-minimal` is the lightest self-contained one.
profile = "sdk-minimal"
# Model id handed to the harness on each run.
model = "deepseek-v4-flash"
# Hard ceiling for a single harness run, in seconds. DSH tasks are long by
# nature, so this is deliberately generous.
task_timeout = 600
# Directory where run logs and artifacts are written.
log_dir = ""
