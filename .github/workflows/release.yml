# Generated by neko-plugin
# managed-template: plugin-market-actions-v1
name: Release N.E.K.O Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  # The upstream release workflow signs build provenance in an isolated job,
  # which needs OIDC + attestation write. A caller that grants less than the
  # called workflow requests fails at workflow startup ("workflow file issue"),
  # which is exactly how v0.2.4 died after upstream added the signing job.
  id-token: write
  attestations: write

jobs:
  release:
    uses: Project-N-E-K-O/N.E.K.O/.github/workflows/plugin-market-release.yml@main
    with:
      plugin-id: deepseekharness_bridge
      neko-repository: Project-N-E-K-O/N.E.K.O
      neko-ref: main
