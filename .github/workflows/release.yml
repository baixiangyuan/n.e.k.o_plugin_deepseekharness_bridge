name: Release N.E.K.O Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      # 发布前跑完整校验，任何一项不过就不发版。
      - name: Check plugin (release)
        run: uv run neko-plugin check dsh_bridge --release --skip-tests

      - name: Build package
        run: |
          mkdir -p dist
          uv run neko-plugin package dsh_bridge --output dist/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.neko-plugin
          generate_release_notes: true
