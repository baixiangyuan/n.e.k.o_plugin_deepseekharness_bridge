name: Verify N.E.K.O Plugin

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      # 依赖声明 + vendor 规则 + manifest 契约 + 入口类检查。
      - name: Check plugin
        run: uv run neko-plugin check dsh_bridge --strict

      # 本插件零第三方依赖，无需 sync；若将来加了依赖，把下面取消注释：
      # - name: Sync dependencies
      #   run: uv run neko-plugin sync dsh_bridge --clean

      - name: Run tests
        # tests/ 自带 pytest.ini，让 rootdir 落在 tests/ 自身，避免 pytest 把
        # 插件入口 __init__.py 当父包导入（它依赖 CI 里不存在的 plugin.sdk）。
        run: uv run --with pytest pytest tests

      - name: Build package
        run: |
          mkdir -p dist
          uv run neko-plugin package dsh_bridge --output dist/

      - name: Inspect package
        run: uv run neko-plugin inspect dist/*.neko-plugin
